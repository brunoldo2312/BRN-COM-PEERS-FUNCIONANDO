# .github/workflows/python-publish.yml
# Build + Release do nó BRN
# Roda quando você cria um release no GitHub, ou manualmente.

name: Build & Release BRN Node

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: v11.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Syntax check
        run: |
          python -m compileall -q . -x 'venv|\.venv|__pycache__|\.git'

      - name: Determinar versão
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Preparar pacote
        run: |
          mkdir -p dist/brn-node
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='env' \
            --exclude='*.db' \
            --exclude='*.db-wal' \
            --exclude='*.db-shm' \
            --exclude='*.log' \
            --exclude='node_identity.enc' \
            --exclude='node_identity.enc.bak' \
            --exclude='wallet_encrypted.dat' \
            --exclude='miner_wallet.enc' \
            --exclude='audit.log*' \
            --exclude='brn_cert.pem' \
            --exclude='brn_key.pem' \
            --exclude='dist' \
            ./ dist/brn-node/

          test -f dist/brn-node/main.py || (echo "FALTA main.py" && exit 1)
          test -f dist/brn-node/requirements.txt || (echo "FALTA requirements.txt" && exit 1)

          cat > dist/brn-node/COMO_RODAR.txt <<'EOF'
          BRN Node — Instalação rápida
          ============================

          1. pip install -r requirements.txt
          2. export BRN_NETWORK_SECRET="sua-frase-secreta"
             export BRN_NODE_PASSWORD="senha-forte-do-no"
          3. python check_deps.py
          4. python main.py --status
          5. python main.py
          EOF

          cd dist
          VERSION="${{ steps.ver.outputs.version }}"
          tar -czf "brn-node-${VERSION}.tar.gz" brn-node/
          zip -r "brn-node-${VERSION}.zip" brn-node/
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brn-node-${{ steps.ver.outputs.version }}
          path: |
            dist/brn-node-*.tar.gz
            dist/brn-node-*.zip
          retention-days: 30

      - name: Anexar ao release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/brn-node-${{ steps.ver.outputs.version }}.tar.gz
            dist/brn-node-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
